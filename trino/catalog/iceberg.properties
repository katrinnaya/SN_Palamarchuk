connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=demo
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/demo_db
iceberg.jdbc-catalog.connection-user=admin
iceberg.jdbc-catalog.connection-password=admin
iceberg.jdbc-catalog.default-warehouse-dir=s3a://demo-iceberg-warehouse/

# S3/Hadoop-совместимые настройки — через hive.*
hive.s3.aws-access-key=admin
hive.s3.aws-secret-key=admin123
hive.s3.endpoint=http://minio:9000
hive.s3.path-style-access=true
hive.s3.region=us-east-1